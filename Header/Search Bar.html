<div id="zjSearchOverlay" class="zj-search-overlay">
    <div class="zj-search-container">
        
        <div class="zj-search-header">
            <a href="../../index.html" class="zj-search-logo">
                <img src="Assets/Zaidi-Logo-1.png" alt="Zaidi Jewelers">
            </a>
            <button id="zjSearchClose" class="zj-search-close" aria-label="Close Search">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>

        <div class="zj-search-bar-wrapper">
            <div class="zj-search-bar">
                <div class="zj-search-category">
                    <select id="zjSearchCategory">
                        <option value="all">All Categories</option>
                        <option value="ring">Ring</option>
                        <option value="earring">Earring</option>
                        <option value="ear-stud">Ear Stud</option>
                        <option value="necklace">Necklace</option>
                        <option value="bracelet">Bracelet</option>
                        <option value="wedding-band">Wedding Band</option>
                    </select>
                </div>
                
                <div class="zj-search-divider"></div>
                
                <input type="text" id="zjSearchInput" class="zj-search-input" placeholder="Search products, collections, or brands..." autocomplete="off">
                
                <button id="zjSearchSubmit" class="zj-search-submit" aria-label="Search">
                    <span class="material-symbols-outlined">search</span>
                </button>
            </div>
        </div>

        <div id="zjSearchSuggestions" class="zj-search-suggestions">
            </div>

    </div>
</div>
