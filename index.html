<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zaidi Jewelers - Home</title>

  <!-- Google Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <!-- Component Stylesheets -->
  <link rel="stylesheet" href="Header/Header.css" />
  <link rel="stylesheet" href="Home Page.css" />
  <link rel="stylesheet" href="Footer/Footer.css" />
</head>
<body>

  <!-- Header Placeholder -->
  <div id="header-placeholder"></div>

  <!-- Main Home Page Sections -->
  <main id="main-content">
    <div id="home-page-placeholder"></div>
  </main>

  <!-- Footer Placeholder -->
  <div id="footer-placeholder"></div>

  <!-- JavaScript Dynamic Component Loader -->
  <script>
    async function loadComponent(elementId, filePath) {
      try {
        const response = await fetch(filePath);
        if (response.ok) {
          const html = await response.text();
          document.getElementById(elementId).innerHTML = html;
        } else {
          console.error(`Error loading ${filePath}: ${response.statusText}`);
        }
      } catch (error) {
        console.error(`Fetch error for ${filePath}:`, error);
      }
    }

    // Helper function to load and execute scripts reliably
    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = () => resolve();
        script.onerror = () => reject(new Error(`Failed to load script: ${src}`));
        document.body.appendChild(script);
      });
    }

    window.addEventListener('DOMContentLoaded', async () => {
      // 1. Load HTML Components sequentially
      await loadComponent('header-placeholder', 'Header/Header.html');
      await loadComponent('home-page-placeholder', 'Home Page.html');
      await loadComponent('footer-placeholder', 'Footer/Footer.html');

      // 2. Load JS files with CORRECT relative paths
      await loadScript('Header/header.js');
      await loadScript('Home Page.js');
      await loadScript('Footer/Footer.js');
    });
  </script>
</body>
</html>
